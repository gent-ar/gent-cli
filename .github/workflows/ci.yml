name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-compat:
    name: public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exported library APIs against main
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: origin/main
          exclude: gent-cli,gentd
          feature-group: all-features
          release-type: patch
  coverage:
    name: workspace line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 90
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            smoke: bash tools/smoke-local-ipc.sh
          - os: ubuntu-latest
            smoke: bash tools/smoke-local-ipc.sh
          - os: windows-latest
            smoke: powershell -ExecutionPolicy Bypass -File tools/smoke-local-ipc.ps1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: python tools/check-architecture.py
      - run: cargo run --quiet -p gent-testkit --bin validate-coverage-manifest -- fixtures/coverage-manifest.yml
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: ${{ matrix.smoke }}
