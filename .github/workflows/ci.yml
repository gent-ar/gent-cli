name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            smoke: bash tools/smoke-local-ipc.sh
          - os: ubuntu-latest
            smoke: bash tools/smoke-local-ipc.sh
          - os: windows-latest
            smoke: powershell -ExecutionPolicy Bypass -File tools/smoke-local-ipc.ps1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: python tools/check-architecture.py
      - run: cargo run --quiet -p gent-testkit --bin validate-coverage-manifest -- fixtures/coverage-manifest.yml
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: ${{ matrix.smoke }}
