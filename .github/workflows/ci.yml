name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-compat:
    name: public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exported library APIs against main
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: origin/main
          exclude: gent-cli,gentd
          feature-group: all-features
          release-type: patch
  coverage:
    name: production library line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.6.21 --locked
      - run: bash tools/run-coverage.sh
      - run: bash tools/test-run-coverage.sh
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            smoke: bash tools/smoke-local-ipc.sh
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
            node_arch: arm64
          - os: ubuntu-latest
            smoke: bash tools/smoke-local-ipc.sh
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
            node_arch: x64
          - os: windows-latest
            smoke: powershell -ExecutionPolicy Bypass -File tools/smoke-local-ipc.ps1
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: .exe
            node_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          architecture: ${{ matrix.node_arch }}
      - uses: actions/checkout@v4
        with:
          repository: Kuberwastaken/claurst
          ref: 00db2b6
          path: claurst-upstream
      - run: cargo fmt --check
      - run: python tools/check-architecture.py
      - if: runner.os != 'Windows'
        run: sh -n tools/install.sh
      - if: runner.os != 'Windows'
        run: bash -n tools/smoke-installed-ipc.sh
      - if: runner.os != 'Windows'
        run: python tools/test-install-activation.py
      - if: runner.os != 'Windows'
        run: python tools/test-supervise-runtime-activation.py
      - if: runner.os != 'Windows'
        run: python tools/test-update-handoff.py
      - if: runner.os != 'Windows'
        run: python tools/test-gent-auto-update.py
      - if: runner.os != 'Windows'
        run: python tools/test-installer-runtime-bootstrap.py
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tools/test-install-windows.ps1
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tools/test-gent-auto-update-windows.ps1
      - run: python -m py_compile tools/capture-public-driver-transcript.py
      - run: python tools/test-capture-public-driver-transcript.py
      - run: python -m py_compile tools/update-public-driver-transcripts.py
      - run: python tools/test-update-public-driver-transcripts.py
      - run: python tools/validate-driver-transcript-corpus.py
      - run: python tools/test-validate-driver-transcript-corpus.py
      - run: python tools/test-replay-driver-transcript-corpus.py
      - run: python -m py_compile tools/validate-malformed-driver-evidence.py
      - run: python tools/test-validate-malformed-driver-evidence.py
      - run: python -m py_compile tools/capture-codex-app-server-transcript.py
      - run: python tools/test-capture-codex-app-server-transcript.py
      - run: python -m py_compile tools/capture-codex-subagent-transcript.py
      - run: python tools/test-capture-codex-subagent-transcript.py
      - run: python -m py_compile tools/capture-codex-mcp-transcript.py
      - run: python tools/test-capture-codex-mcp-transcript.py
      - run: python -m py_compile tools/capture-claude-subagent-transcript.py
      - run: python tools/test-capture-claude-subagent-transcript.py
      - run: python -m py_compile tools/capture-claude-mcp-transcript.py
      - run: python tools/test-capture-claude-mcp-transcript.py
      - run: python tools/test-release-tools.py
      - run: python -m py_compile tools/sign-runtime-release.py
      - run: python tools/test-sign-runtime-release.py
      - run: python -m py_compile tools/sign-ordinary-authority-release.py
      - run: python tools/test-sign-ordinary-authority-release.py
      - run: python tools/test-generate-runtime-release-key.py
      - run: cargo run --quiet -p gent-testkit --bin validate-public-driver-manifest -- fixtures/public-driver-transcripts/manifest.yml
      - run: cargo run --quiet -p gent-testkit --bin validate-ipc-fixtures -- fixtures/ipc-contract/manifest.json
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features --no-fail-fast
      - run: ${{ matrix.smoke }}
      - name: Package and structurally verify native release archive
        env:
          SOURCE_DATE_EPOCH: "1700000000"
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          cargo build --locked --release -p gent-cli -p gentd --bins
          node_args=()
          if [ "$RUNNER_OS" = "Windows" ]; then node_args+=(--windows); fi
          python tools/stage-node-runtime.py --node node --out-dir dist-runtime/node "${node_args[@]}"
          python tools/stage-claurst-runtime.py --target "$RELEASE_TARGET" --out-dir dist-runtime/claurst --profile release --claurst-source-dir claurst-upstream
          python tools/test-staged-claurst-runtime.py --runtime-dir dist-runtime/claurst
          python tools/package-release.py --target-dir target/release --out-dir dist \
            --version v0.0.0-ci --target "$RELEASE_TARGET" --format "$RELEASE_ARCHIVE" \
            --suffix "$RELEASE_SUFFIX" --node-runtime-dir dist-runtime/node \
            --claurst-runtime-dir dist-runtime/claurst
          python tools/verify-release.py "dist/gent-v0.0.0-ci-$RELEASE_TARGET.$RELEASE_ARCHIVE" \
            --manifest "dist/gent-v0.0.0-ci-$RELEASE_TARGET.$RELEASE_ARCHIVE.manifest.json" \
            --checksum "dist/gent-v0.0.0-ci-$RELEASE_TARGET.$RELEASE_ARCHIVE.sha256" \
            --version v0.0.0-ci --target "$RELEASE_TARGET"
