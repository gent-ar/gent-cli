name: provider authority

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-authority
  cancel-in-progress: false

jobs:
  verify:
    name: pinned provider contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cargo test -p gent-drivers --test provider_contract_drift
      - run: cd tools && python test-provider-pins.py && python test-provider-contract-snapshot.py && python test-build-ordinary-authority.py

  publish:
    name: sign and publish the provider authority
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Collect the authorities whose Node runtimes stay supported
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p carried previous
          tag="$(gh release view --json tagName --jq .tagName)"
          archive="gent-$tag-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$tag" --pattern "$archive" --pattern "$archive.sigstore.json"
          cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
            --certificate-identity-regexp '^https://github.com/gent-ar/gent-cli/.github/workflows/release.yml@refs/tags/v.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar -xzf "$archive" -C carried --wildcards --no-anchored 'authority/ordinary-authority.json'
          if gh release download provider-authority --dir previous --pattern 'ordinary-authority.json*'; then
            cosign verify-blob previous/ordinary-authority.json --bundle previous/ordinary-authority.json.sigstore.json \
              --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/provider-authority.yml@refs/heads/main' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          fi
      - name: Sign the authority from pins with the carried Node runtimes
        shell: bash
        env:
          RUNTIME_RELEASE_PRIVATE_KEY: ${{ secrets.GENT_RUNTIME_RELEASE_PRIVATE_KEY }}
          RUNTIME_RELEASE_KEY_ID: ${{ vars.GENT_RUNTIME_RELEASE_KEY_ID }}
        run: |
          mapfile -t carried < <(find carried previous -name ordinary-authority.json | sort)
          test "${#carried[@]}" -gt 0
          python tools/build-ordinary-authority.py --out published/ordinary-authority.json \
            $(printf -- '--carry-node-digests %s ' "${carried[@]}")
          cosign sign-blob --yes published/ordinary-authority.json --bundle published/ordinary-authority.json.sigstore.json
      - name: Replace the published provider authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view provider-authority >/dev/null 2>&1 ||
            gh release create provider-authority --prerelease --latest=false --target "$GITHUB_SHA" \
              --title 'Provider authority' --notes 'Signed provider pins Gentd adopts without a Gent release.'
          gh release upload provider-authority published/ordinary-authority.json published/ordinary-authority.json.sigstore.json --clobber
