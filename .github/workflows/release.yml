name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,re,sys; sys.exit(not bool(re.fullmatch(r'v[0-9]+\\.[0-9]+\\.[0-9]+', os.environ['RELEASE_TAG'])))"
      - name: Require tag and shipped binary versions to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python - metadata.json "$RELEASE_TAG" <<'PY'
          import json, pathlib, sys
          packages = {item['name']: item['version'] for item in json.loads(pathlib.Path(sys.argv[1]).read_text())['packages']}
          expected = sys.argv[2].removeprefix('v')
          if any(packages.get(name) != expected for name in ('gent-cli', 'gentd')):
              raise SystemExit('release tag must equal both gent-cli and gentd package versions')
          PY
      - run: cargo fmt --check
      - run: python tools/check-architecture.py
      - run: sh -n tools/install.sh
      - run: python tools/test-install-activation.py
      - run: python tools/test-supervise-runtime-activation.py
      - run: python tools/test-update-handoff.py
      - run: python tools/test-gent-auto-update.py
      - run: python tools/test-install-update-material.py
      - run: python tools/test-installer-runtime-bootstrap.py
      - run: python -m py_compile tools/capture-public-driver-transcript.py
      - run: python tools/test-capture-public-driver-transcript.py
      - run: python -m py_compile tools/update-public-driver-transcripts.py
      - run: python tools/test-update-public-driver-transcripts.py
      - run: python -m py_compile tools/validate-malformed-driver-evidence.py
      - run: python tools/test-validate-malformed-driver-evidence.py
      - run: python -m py_compile tools/capture-codex-app-server-transcript.py
      - run: python tools/test-capture-codex-app-server-transcript.py
      - run: python -m py_compile tools/capture-codex-subagent-transcript.py
      - run: python tools/test-capture-codex-subagent-transcript.py
      - run: python -m py_compile tools/capture-codex-mcp-transcript.py
      - run: python tools/test-capture-codex-mcp-transcript.py
      - run: python -m py_compile tools/capture-claude-subagent-transcript.py
      - run: python tools/test-capture-claude-subagent-transcript.py
      - run: python -m py_compile tools/capture-claude-mcp-transcript.py
      - run: python tools/test-capture-claude-mcp-transcript.py
      - run: python tools/test-release-tools.py
      - run: python tools/test-generate-runtime-release-key.py
      - run: cargo run --quiet -p gent-testkit --bin validate-coverage-manifest -- fixtures/coverage-manifest.yml
      - run: cargo run --quiet -p gent-testkit --bin validate-public-driver-manifest -- fixtures/public-driver-transcripts/manifest.yml
      - run: cargo run --quiet -p gent-testkit --bin validate-ipc-fixtures -- fixtures/ipc-contract/manifest.json
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: bash tools/smoke-local-ipc.sh

  package:
    name: package (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
            target_dir: target/release
            build_target: ""
          # macos-13 Intel runners are no longer reliably available. macOS's
          # linker can emit this target from the hosted ARM runner, and the
          # cross build is exercised before its archive is published.
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            suffix: ""
            target_dir: target/x86_64-apple-darwin/release
            build_target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
            target_dir: target/release
            build_target: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: .exe
            target_dir: target/release
            build_target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive deterministic package timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build release binaries
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
        run: |
          if [ -n "$BUILD_TARGET" ]; then
            rustup target add "$BUILD_TARGET"
            cargo build --locked --release --target "$BUILD_TARGET" -p gent-cli -p gentd --bins
          else
            cargo build --locked --release -p gent-cli -p gentd --bins
          fi
      - if: runner.os == 'Windows'
        name: Verify Windows installer activation
        run: powershell -ExecutionPolicy Bypass -File tools/test-install-windows.ps1
      - name: Package binaries
        run: >-
          python tools/package-release.py --target-dir "${{ matrix.target_dir }}" --out-dir dist
          --version "${{ github.ref_name }}" --target "${{ matrix.target }}"
          --format "${{ matrix.archive }}" --suffix "${{ matrix.suffix }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keylessly sign every published artifact
        shell: bash
        run: |
          for artifact in dist/*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create signed runtime-release metadata
        shell: bash
        env:
          RUNTIME_RELEASE_PRIVATE_KEY: ${{ secrets.GENT_RUNTIME_RELEASE_PRIVATE_KEY }}
          RUNTIME_RELEASE_KEY_ID: ${{ vars.GENT_RUNTIME_RELEASE_KEY_ID }}
          RUNTIME_RELEASE_PUBLIC_KEY: ${{ vars.GENT_RUNTIME_RELEASE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$RUNTIME_RELEASE_PRIVATE_KEY"
          test -n "$RUNTIME_RELEASE_KEY_ID"
          case "$RUNTIME_RELEASE_PUBLIC_KEY" in (????????????????????????????????????????????????????????????????) ;; (*) exit 1 ;; esac
          case "$RUNTIME_RELEASE_PUBLIC_KEY" in (*[!0-9a-f]*) exit 1 ;; esac
          key="$RUNNER_TEMP/gent-runtime-release.pem"
          umask 077
          printf '%s\n' "$RUNTIME_RELEASE_PRIVATE_KEY" > "$key"
          derived_key=$(python - "$key" <<'PY'
          import importlib.util, pathlib, sys
          path = pathlib.Path('tools/sign-runtime-release.py')
          spec = importlib.util.spec_from_file_location('runtime_release_signer', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.public_key(module.load_seed(pathlib.Path(sys.argv[1]))).hex())
          PY
          )
          test "$derived_key" = "$RUNTIME_RELEASE_PUBLIC_KEY"
          expires_at=$(date -u --date '+90 days' +%s)
          while IFS= read -r manifest; do
            target=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"])' "$manifest")
            output="$(dirname "$manifest")/gent-$RELEASE_TAG-$target.runtime-release.json"
            python tools/sign-runtime-release.py \
              --archive-manifest "$manifest" --version "$RELEASE_TAG" --target "$target" \
              --key-id "$RUNTIME_RELEASE_KEY_ID" --private-key "$key" --expires-at "$expires_at" \
              --protocol-min 1 --protocol-max 1 --schema-max 23 \
              --minimum-app-version "${RELEASE_TAG#v}" --out "$output"
          done < <(find release-artifacts -name '*.manifest.json' -type f | sort)
          set -- --key-id "$RUNTIME_RELEASE_KEY_ID" --private-key "$key" --expires-at "$expires_at" \
            --out "release-artifacts/gent-$RELEASE_TAG.runtime-release-index.json"
          while IFS= read -r release; do
            set -- "$@" --runtime-release "$release"
          done < <(find release-artifacts -name '*.runtime-release.json' -type f | sort)
          python tools/sign-runtime-index.py "$@"
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path('release-artifacts/gent-runtime-release-trust.json').write_text(json.dumps({
              'schemaVersion': 1,
              'keys': [{'keyId': os.environ['RUNTIME_RELEASE_KEY_ID'], 'publicKeyHex': os.environ['RUNTIME_RELEASE_PUBLIC_KEY']}],
          }, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          rm -f "$key"
          find release-artifacts \( -name '*.runtime-release.json' -o -name 'gent-runtime-release-index.json' -o -name 'gent-runtime-release-trust.json' \) -type f -print0 \
            | xargs -0 -n1 sh -c 'cosign sign-blob --yes --bundle "$0.sigstore.json" "$0"'
      - name: Sign the installer bootstrap
        shell: bash
        run: |
          cp tools/install.sh release-artifacts/gent-install.sh
          cp tools/install.ps1 release-artifacts/gent-install.ps1
          cp tools/activate-install.py release-artifacts/gent-activate-install.py
          cp tools/gent-auto-update.py release-artifacts/gent-auto-update.py
          cp tools/supervise-runtime-activation.py release-artifacts/gent-supervise-runtime-activation.py
          cosign sign-blob --yes --bundle release-artifacts/gent-install.sh.sigstore.json release-artifacts/gent-install.sh
          cosign sign-blob --yes --bundle release-artifacts/gent-install.ps1.sigstore.json release-artifacts/gent-install.ps1
          cosign sign-blob --yes --bundle release-artifacts/gent-activate-install.py.sigstore.json release-artifacts/gent-activate-install.py
          cosign sign-blob --yes --bundle release-artifacts/gent-auto-update.py.sigstore.json release-artifacts/gent-auto-update.py
          cosign sign-blob --yes --bundle release-artifacts/gent-supervise-runtime-activation.py.sigstore.json release-artifacts/gent-supervise-runtime-activation.py
      - name: Publish signed artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0 | sort -z)
          test "${#artifacts[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${artifacts[@]}" --generate-notes

  install-smoke:
    name: published install smoke
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify and run the published bootstrap
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/gent-ar/gent-cli/releases/download/$RELEASE_TAG"
          curl --fail --location --silent --show-error --output gent-install.sh "$base/gent-install.sh"
          curl --fail --location --silent --show-error --output gent-install.sh.sigstore.json "$base/gent-install.sh.sigstore.json"
          cosign verify-blob gent-install.sh --bundle gent-install.sh.sigstore.json \
            --certificate-identity-regexp "^https://github.com/gent-ar/gent-cli/.github/workflows/release.yml@refs/tags/$RELEASE_TAG$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' >/dev/null
          export GENT_INSTALL_DIR="$RUNNER_TEMP/gent-install"
          sh gent-install.sh --version "$RELEASE_TAG"
          GENT_BIN_DIR="$GENT_INSTALL_DIR/bin" GENT_EXPECTED_VERSION="${RELEASE_TAG#v}" \
            bash tools/smoke-installed-ipc.sh
