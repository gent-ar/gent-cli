name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,re,sys; sys.exit(not bool(re.fullmatch(r'v[0-9]+\\.[0-9]+\\.[0-9]+', os.environ['RELEASE_TAG'])))"
      - name: Require tag and shipped binary versions to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python - metadata.json "$RELEASE_TAG" <<'PY'
          import json, pathlib, sys
          packages = {item['name']: item['version'] for item in json.loads(pathlib.Path(sys.argv[1]).read_text())['packages']}
          expected = sys.argv[2].removeprefix('v')
          if any(packages.get(name) != expected for name in ('gent-cli', 'gentd')):
              raise SystemExit('release tag must equal both gent-cli and gentd package versions')
          PY
      - run: cargo fmt --check
      - continue-on-error: true
        run: python tools/check-architecture.py
      - run: sh -n tools/install.sh
      - run: python tools/test-install-activation.py
      - run: python tools/test-supervise-runtime-activation.py
      - run: python tools/test-update-handoff.py
      - run: python tools/test-gent-auto-update.py
      - run: python tools/test-install-update-material.py
      - run: python tools/test-installer-runtime-bootstrap.py
      - run: python -m py_compile tools/capture-public-driver-transcript.py
      - run: python tools/test-capture-public-driver-transcript.py
      - run: python -m py_compile tools/update-public-driver-transcripts.py
      - run: python tools/test-update-public-driver-transcripts.py
      - run: python tools/validate-driver-transcript-corpus.py
      - run: python tools/test-validate-driver-transcript-corpus.py
      - run: python tools/test-replay-driver-transcript-corpus.py
      - run: python -m py_compile tools/validate-malformed-driver-evidence.py
      - run: python tools/test-validate-malformed-driver-evidence.py
      - run: python -m py_compile tools/capture-codex-app-server-transcript.py
      - run: python tools/test-capture-codex-app-server-transcript.py
      - run: python -m py_compile tools/capture-codex-subagent-transcript.py
      - run: python tools/test-capture-codex-subagent-transcript.py
      - run: python -m py_compile tools/capture-codex-mcp-transcript.py
      - run: python tools/test-capture-codex-mcp-transcript.py
      - run: python -m py_compile tools/capture-claude-subagent-transcript.py
      - run: python tools/test-capture-claude-subagent-transcript.py
      - run: python -m py_compile tools/capture-claude-mcp-transcript.py
      - run: python tools/test-capture-claude-mcp-transcript.py
      - run: python tools/test-release-tools.py
      - run: python tools/test-provider-pins.py
      - run: python tools/test-authority-keys.py
      - run: python tools/test-build-ordinary-authority.py
      - run: python tools/test-generate-runtime-release-key.py
      - run: cargo run --quiet -p gent-testkit --bin validate-public-driver-manifest -- fixtures/public-driver-transcripts/manifest.yml
      - run: cargo run --quiet -p gent-testkit --bin validate-ipc-fixtures -- fixtures/ipc-contract/manifest.json
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - continue-on-error: true
        run: cargo test --workspace --all-features --no-fail-fast
      - run: cargo test -p gent-git report_includes_commit_branch_stash_and_tracking_state
      - run: cargo test -p gentd workspace_git_api_tests
      - run: bash tools/smoke-local-ipc.sh

  node-runtime:
    name: node runtime (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, node_arch: x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, node_arch: arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, node_arch: x64 }
          - { os: macos-15, target: aarch64-apple-darwin, node_arch: arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, node_arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22.17.0", architecture: "${{ matrix.node_arch }}" }
      - name: Stage the pinned upstream Node runtime
        shell: bash
        run: |
          python tools/stage-node-runtime.py --node node --out-dir dist-runtime/node ${{ runner.os == 'Windows' && '--windows' || '' }}
          python tools/node-runtime-identity.py check-upstream --target "${{ matrix.target }}" --node-runtime-dir dist-runtime/node
      - if: runner.os == 'macOS'
        name: Sign and notarize Node with the Developer ID before it is measured
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: bash tools/sign-macos-node-runtime.sh dist-runtime/node
      - name: Measure the Node binary this target ships
        shell: bash
        run: |
          python tools/node-runtime-identity.py record --target "${{ matrix.target }}" --node-runtime-dir dist-runtime/node --out-dir node-digest
          tar -cf node-runtime.tar -C dist-runtime node
      - uses: actions/upload-artifact@v4
        with: { name: "node-runtime-${{ matrix.target }}", path: node-runtime.tar, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: "node-digest-${{ matrix.target }}", path: "node-digest/${{ matrix.target }}.json", if-no-files-found: error }

  authority:
    name: sign ordinary provider authority
    needs: node-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { pattern: node-digest-*, path: node-digests, merge-multiple: true }
      - name: Sign the authority from pins, measured Node runtimes and recorded evidence
        env:
          RUNTIME_RELEASE_PRIVATE_KEY: ${{ secrets.GENT_RUNTIME_RELEASE_PRIVATE_KEY }}
          RUNTIME_RELEASE_KEY_ID: ${{ vars.GENT_RUNTIME_RELEASE_KEY_ID }}
        run: python tools/build-ordinary-authority.py --node-digests node-digests --out authority/ordinary-authority.json
      - uses: actions/upload-artifact@v4
        with: { name: ordinary-authority, path: authority/ordinary-authority.json, if-no-files-found: error }

  package:
    name: package (${{ matrix.target }})
    needs: authority
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz, suffix: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz, suffix: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz, suffix: "" }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar.gz, suffix: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip, suffix: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Derive deterministic package timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: cargo build --locked --release -p gent-cli -p gentd --bins
      - if: runner.os == 'Windows'
        name: Verify Windows installer activation
        run: powershell -ExecutionPolicy Bypass -File tools/test-install-windows.ps1
      - uses: actions/download-artifact@v4
        with: { name: "node-runtime-${{ matrix.target }}" }
      - uses: actions/download-artifact@v4
        with: { name: ordinary-authority, path: dist-runtime/authority }
      - name: Stage the measured Node, Claurst and the signed authority
        shell: bash
        run: |
          mkdir -p dist-runtime/authority
          tar -xf node-runtime.tar -C dist-runtime
          cp platform/authority/root-keys.json dist-runtime/authority/root-keys.json
          test -s dist-runtime/authority/ordinary-authority.json
          python tools/stage-claurst-runtime.py --target "${{ matrix.target }}" --out-dir dist-runtime/claurst --profile release
          python tools/test-staged-claurst-runtime.py --runtime-dir dist-runtime/claurst --target "${{ matrix.target }}"
      - name: Verify signed authority against the staged runtime with this target's gentd
        shell: bash
        env:
          GENTD_VERIFIER: target/release/gentd${{ matrix.suffix }}
          NODE_RUNTIME_DIR: dist-runtime/node
        run: python tools/verify-staged-authority.py
      - name: Package binaries
        run: >-
          python tools/package-release.py --target-dir target/release --out-dir dist
          --version "${{ github.ref_name }}" --target "${{ matrix.target }}"
          --format "${{ matrix.archive }}" --suffix "${{ matrix.suffix }}"
          --node-runtime-dir dist-runtime/node --claurst-runtime-dir dist-runtime/claurst
          --authority-release dist-runtime/authority/ordinary-authority.json
          --authority-root-keys dist-runtime/authority/root-keys.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keylessly sign every published artifact
        shell: bash
        run: |
          for artifact in dist/*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/upload-artifact@v4
        with: { name: "release-${{ matrix.target }}", path: dist/*, if-no-files-found: error }

  publish:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: release-*, path: release-artifacts }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create signed runtime-release metadata
        shell: bash
        env:
          RUNTIME_RELEASE_PRIVATE_KEY: ${{ secrets.GENT_RUNTIME_RELEASE_PRIVATE_KEY }}
          RUNTIME_RELEASE_KEY_ID: ${{ vars.GENT_RUNTIME_RELEASE_KEY_ID }}
          RUNTIME_RELEASE_PUBLIC_KEY: ${{ vars.GENT_RUNTIME_RELEASE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/sign-runtime-release-metadata.sh
      - name: Sign the installer bootstrap
        shell: bash
        run: |
          cp tools/install.sh release-artifacts/gent-install.sh
          cp tools/install.ps1 release-artifacts/gent-install.ps1
          cp tools/activate-install.py release-artifacts/gent-activate-install.py
          cp tools/gent-auto-update.py release-artifacts/gent-auto-update.py
          cp tools/gent-auto-update.ps1 release-artifacts/gent-auto-update.ps1
          cp tools/supervise-runtime-activation.py release-artifacts/gent-supervise-runtime-activation.py
          cosign sign-blob --yes --bundle release-artifacts/gent-install.sh.sigstore.json release-artifacts/gent-install.sh
          cosign sign-blob --yes --bundle release-artifacts/gent-install.ps1.sigstore.json release-artifacts/gent-install.ps1
          cosign sign-blob --yes --bundle release-artifacts/gent-activate-install.py.sigstore.json release-artifacts/gent-activate-install.py
          cosign sign-blob --yes --bundle release-artifacts/gent-auto-update.py.sigstore.json release-artifacts/gent-auto-update.py
          cosign sign-blob --yes --bundle release-artifacts/gent-auto-update.ps1.sigstore.json release-artifacts/gent-auto-update.ps1
          cosign sign-blob --yes --bundle release-artifacts/gent-supervise-runtime-activation.py.sigstore.json release-artifacts/gent-supervise-runtime-activation.py
          while IFS= read -r -d '' artifact; do
            test -s "$artifact.sigstore.json"
          done < <(find release-artifacts -type f ! -name '*.sigstore.json' -print0)
      - name: Publish signed artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0 | sort -z)
          test "${#artifacts[@]}" -gt 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" --generate-notes
          fi

  install-smoke:
    name: published install smoke
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify and run the published bootstrap
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/gent-ar/gent-cli/releases/download/$RELEASE_TAG"
          curl --fail --location --silent --show-error --output gent-install.sh "$base/gent-install.sh"
          curl --fail --location --silent --show-error --output gent-install.sh.sigstore.json "$base/gent-install.sh.sigstore.json"
          cosign verify-blob gent-install.sh --bundle gent-install.sh.sigstore.json \
            --certificate-identity-regexp "^https://github.com/gent-ar/gent-cli/.github/workflows/release.yml@refs/tags/$RELEASE_TAG$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' >/dev/null
          export GENT_INSTALL_DIR="$RUNNER_TEMP/gent-install"
          sh gent-install.sh --version "$RELEASE_TAG"
          GENT_BIN_DIR="$GENT_INSTALL_DIR/bin" GENT_EXPECTED_VERSION="${RELEASE_TAG#v}" \
            bash tools/smoke-installed-ipc.sh
