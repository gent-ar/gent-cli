[workspace]
members = [
  "crates/gent-types", "crates/gent-ports", "crates/gent-core", "crates/gent-protocol",
  "crates/gent-adapters", "crates/gent-store", "crates/gent-drivers", "crates/gent-git",
  "crates/gent-mcp", "crates/gent-runtime",
  "crates/gent-testkit", "crates/gentd", "crates/gent-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/gent-ar/gent-cli"
homepage = "https://github.com/gent-ar/gent-cli"
authors = ["Gent contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
crossterm = "=0.28.1"
directories = "6.0.0"
ed25519-dalek = "2.2.0"
fs2 = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1
