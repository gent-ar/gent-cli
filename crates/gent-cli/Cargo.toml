[package]
name = "gent-cli"
default-run = "gent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
crossterm.workspace = true
directories.workspace = true
gent-protocol = { path = "../gent-protocol" }
gent-types = { path = "../gent-types" }
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true

[[bin]]
name = "gent"
path = "src/main.rs"

# The Windows archive contains this small, signed dispatcher.  Stable PATH
# entries execute it directly instead of a `.cmd` file, so Windows never asks
# `cmd.exe` to re-parse user supplied arguments during release selection.
[[bin]]
name = "gent-launcher"
path = "src/windows_launcher.rs"

[lints]
workspace = true
