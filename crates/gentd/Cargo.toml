[package]
name = "gentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
directories.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
gent-adapters = { path = "../gent-adapters" }
gent-core = { path = "../gent-core" }
gent-drivers = { path = "../gent-drivers" }
gent-git = { path = "../gent-git" }
gent-mcp = { path = "../gent-mcp" }
gent-ports = { path = "../gent-ports" }
gent-protocol = { path = "../gent-protocol" }
gent-runtime = { path = "../gent-runtime" }
gent-store = { path = "../gent-store" }
gent-types = { path = "../gent-types" }
hex.workspace = true
reqwest.workspace = true
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cap-primitives = "=3.4.5"
winapi-util = "=0.1.11"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gent-linux-sandbox={path="../gent-linux-sandbox"}
rustix = { version = "=1.1.4", features = ["fs"] }
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
rusqlite.workspace = true
gent-testkit = { path = "../gent-testkit" }
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "gentd"
path = "src/main.rs"

[lints]
workspace = true
