schema_version: 3
purpose: cutover_evidence_graph
public_driver_transcript_manifest: public-driver-transcripts/manifest.yml
# schema_version 3 folds in 08-AUDIT-FINDINGS.md (2026-08-14): split rows that
# conflated real legacy behavior with nonexistent/incomplete behavior, added
# 14 UI-visible features that were previously unrepresented, added terminals
# and editor_ide (first-class product surfaces absent from v2), added an
# explicit copilot disposition, and reconciled the claude/codex/claurst
# provider dimension with the code's actual third-provider id ("gent").
enforcement:
  validator: tools/validate-coverage-manifest
  required_before: authority_transfer
  fail_on: [unknown_feature, missing_path, missing_dimension, failed_evidence, expired_exception, missing_legacy_owner]
dimensions:
  # "claurst" is the product/provider-facing name; the code's adapter type id
  # for the same provider is "gent" (AgentAdapter.supportedTypes = {claude,
  # codex, gent}). Evidence rows for provider "claurst" are keyed to adapter
  # id "gent" in the app until/unless the app-side id is renamed to match.
  providers: [claude, codex, claurst, copilot]
  transports: [local_ipc, paired_mux]
  platforms: [macos, linux, windows]
states: [supported, emulated, unsupported, not_applicable, temporarily_unavailable]
required_evidence: [baseline, contract, driver, host, cli, app, security, upgrade, cutover]
provider_implementation:
  claude: rust_native_driver
  codex: rust_native_driver
  claurst: private_external_provider_bridge
  # Copilot ships today (acp_driver.dart, test/fixtures/transcripts/copilot/)
  # but the UI already hides it from selection (retired set in
  # model_picker_sheet.dart) and it has no disposition anywhere in the plan.
  # Recorded here as unsupported with a stable reason per 04-FEATURE-MANIFEST.md's
  # own rule that every provider needs an explicit state, not silent omission.
  copilot: unsupported
features:
  conversations: { state: supported, evidence: required, legacy_owner: app-conversation-host }
  # Split from one "smart_titles"/"smart_recaps" row each: generation exists,
  # but the provenance 04-FEATURE-MANIFEST.md requires (source turn range,
  # provider/version, input digest, status, supersession chain) does not —
  # today's storage is two nullable strings with no provenance at all. This
  # is net-new scope, not preserved behavior; do not treat "matches current
  # title/recap text" as sufficient baseline evidence.
  smart_titles: { state: emulated, evidence: required, legacy_owner: app-conversation-host }
  smart_titles_provenance: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "no legacy provenance tracking exists; net-new durable ConversationTitle entity" }
  smart_recaps: { state: emulated, evidence: required, legacy_owner: app-conversation-host }
  smart_recaps_provenance: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "no legacy provenance tracking exists; net-new durable ConversationRecap entity" }
  sessions_runs: { state: supported, evidence: required, legacy_owner: app-session-host }
  # Provider-switch-creates-child-run-with-lineage (00-PLATFORM-CONTRACT.md
  # invariant #4) has no legacy implementation: today's switch mutates the
  # conversation in place. Net-new behavior, not a port.
  provider_switch: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "legacy switch mutates in place; child-run lineage is net-new per 00-PLATFORM-CONTRACT.md invariant #4" }
  capability_catalog: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "no host-issued capability catalog exists; current capability data is a client-fetched, unsigned manifest" }
  composer_attachments: { state: supported, evidence: required, legacy_owner: app-composer-host }
  streaming: { state: supported, evidence: required, legacy_owner: app-session-host }
  tools: { state: supported, evidence: required, legacy_owner: app-session-host }
  # Split: task aggregation is genuinely emulated/provider-agnostic; plan mode
  # is manifest-declared and provider-native. One row conflated both.
  tasks: { state: emulated, evidence: required, legacy_owner: app-session-host }
  plan_mode: { state: supported, evidence: required, legacy_owner: app-session-host }
  permissions_questions: { state: supported, evidence: required, legacy_owner: app-session-host }
  # Decision *intake* (durable command, idempotency key) is real and correct;
  # decision *settlement* is not implemented for any provider today (0 of 189
  # live control_response commands have ever settled) and needs its own gate
  # so passing "permissions_questions" evidence cannot hide a still-broken
  # settlement path.
  permission_decision_settlement: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "no adapter emits a correlated settlement receipt today; 0 of 189 live decisions have ever settled" }
  policy: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "Policy is a named durable entity in 00-PLATFORM-CONTRACT.md with no Runtime-surface endpoint or legacy store beyond an unsynced local .claude/settings.local.json editor with no remote path" }
  mcp_connectors: { state: supported, evidence: required, legacy_owner: app-mcp-host }
  subagents: { state: emulated, evidence: required, legacy_owner: app-session-host }
  turn_control: { state: supported, evidence: required, legacy_owner: app-session-host }
  checkpoints: { state: supported, evidence: required, legacy_owner: app-session-host }
  automations: { state: supported, evidence: required, legacy_owner: app-automation-host }
  prompts_knowledge: { state: supported, evidence: required, legacy_owner: app-knowledge-host }
  canvas_web_preview: { state: supported, evidence: required, legacy_owner: app-preview-host }
  notifications_activity: { state: supported, evidence: required, legacy_owner: app-activity-host }
  # Split: git operations (28 methods, real and largely working) vs.
  # worktrees (zero legacy implementation). The single prior "git_worktrees:
  # supported" row could not honestly fill legacy_owner/legacy_path for the
  # worktree half.
  git_operations: { state: supported, evidence: required, legacy_owner: app-git-host }
  worktrees: { state: not_applicable, evidence: required, legacy_owner: none, rationale: "no git-worktree or lease code exists anywhere in the app; net-new per 00-PLATFORM-CONTRACT.md invariant #3" }
  pairing: { state: supported, evidence: required, legacy_owner: app-pairing-host }
  # Newly represented: verified as real, shipped UI surfaces with no prior
  # manifest row (08-AUDIT-FINDINGS.md P1-12).
  terminals: { state: supported, evidence: required, legacy_owner: app-terminal-host }
  editor_ide: { state: supported, evidence: required, legacy_owner: app-editor-host }
  skills: { state: supported, evidence: required, legacy_owner: app-skills-host }
  side_questions: { state: supported, evidence: required, legacy_owner: app-session-host }
  voice_input: { state: supported, evidence: required, legacy_owner: app-stt-host }
  usage_accounting: { state: supported, evidence: required, legacy_owner: app-session-host }
  user_bash: { state: supported, evidence: required, legacy_owner: app-session-host }
  file_mentions: { state: supported, evidence: required, legacy_owner: app-session-host }
  ledger_integrity: { state: supported, evidence: required, legacy_owner: app-conversation-host }
  context_management: { state: supported, evidence: required, legacy_owner: app-session-host }
  drawing: { state: supported, evidence: required, legacy_owner: app-canvas-host }
  conversation_export: { state: supported, evidence: required, legacy_owner: app-session-host }
record_shape:
  feature: required_feature_key
  provider: provider_plus_version_or_not_applicable
  platform: platform
  transport: transport
  state: states
  evidence_paths: concrete_paths_for_required_evidence
  ci_artifact: signed_passing_artifact_id
  legacy_path: concrete_legacy_source_path
  removal_approval: required_before_legacy_deletion
  removal_release: app_release_version_legacy_path_is_deleted_in
  exception_expiry: required_only_for_temporarily_unavailable
  rationale: required_only_for_not_applicable
  provider_implementation: rust_native_driver_or_private_external_provider_bridge
  private_evidence: redacted_signed_provenance_required_for_private_bridge
